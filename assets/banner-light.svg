<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">show</title>
  <desc id="desc">show, Swift developer. A terminal types: code, and replies: code is cheap. Then it types: show me the taste.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.08" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#ff8d28" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff8d28" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.9" cy="1" r="0.5">
      <stop offset="0" stop-color="#ff8d28" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff8d28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8d28"/>
      <stop offset="1" stop-color="#c55300"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2328" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="16"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f2328" flood-opacity="0.18"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 168px; font-weight: 800; letter-spacing: -5px; fill: url(#ink); }
    .role { font-size: 44px; font-weight: 600; fill: #1f2328; }
    .term-bg { fill: #0d1117; }
    .term-title { font-size: 20px; fill: #6e7681; }
    .t { font-size: 45px; fill: #e6edf3; }
    .ps { fill: #ff9230; font-weight: 700; }
    .out { fill: #8b949e; }
    .cursor { fill: #ff9230; animation: type 0.01s linear 2.95s both, blink 1.1s step-end 2.95s infinite; }

    .fx { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .r { animation: on 0.01s linear both; }
    .k { animation: type 0.01s linear both; }

    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes on { from { opacity: 0; } to { opacity: 1; } }
    @keyframes type { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @keyframes blink { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .fx, .r, .k, .cursor { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <rect width="1200" height="360" fill="url(#glow-a)"/>
    <rect width="1200" height="360" fill="url(#glow-b)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#d0d7de"/>

  <g class="fx">
    <text class="sans name" x="50" y="200">show.</text>
  </g>
  <g class="fx" style="animation-delay: 0.1s">
    <text class="sans role" x="58" y="266">Swift developer</text>
  </g>

  <g class="fx" style="animation-delay: 0.2s">
    <rect class="term-bg" x="548.5" y="40.5" width="595" height="279" rx="16" filter="url(#shadow)"/>
    <circle cx="576" cy="70" r="8" fill="#ff5f57"/>
    <circle cx="602" cy="70" r="8" fill="#febc2e"/>
    <circle cx="628" cy="70" r="8" fill="#28c840"/>
    <text class="mono term-title" x="846" y="77" text-anchor="middle">zsh</text>
    <line x1="549" y1="100.5" x2="1143" y2="100.5" stroke="#21262d"/>

    <text class="mono t" x="574" y="163"><tspan class="ps">&#10095;</tspan> <tspan class="k" style="animation-delay: 0.90s">c</tspan><tspan class="k" style="animation-delay: 0.98s">o</tspan><tspan class="k" style="animation-delay: 1.06s">d</tspan><tspan class="k" style="animation-delay: 1.14s">e</tspan></text>
    <text class="mono t out r" x="574" y="225" style="animation-delay: 1.45s">zsh: code is cheap.</text>
    <text class="mono t r" x="574" y="287" style="animation-delay: 1.75s"><tspan class="ps">&#10095;</tspan> <tspan class="k" style="animation-delay: 1.95s">s</tspan><tspan class="k" style="animation-delay: 2.01s">h</tspan><tspan class="k" style="animation-delay: 2.07s">o</tspan><tspan class="k" style="animation-delay: 2.13s">w</tspan><tspan class="k" style="animation-delay: 2.19s"> m</tspan><tspan class="k" style="animation-delay: 2.25s">e</tspan><tspan class="k" style="animation-delay: 2.31s"> t</tspan><tspan class="k" style="animation-delay: 2.37s">h</tspan><tspan class="k" style="animation-delay: 2.43s">e</tspan><tspan class="k" style="animation-delay: 2.49s"> t</tspan><tspan class="k" style="animation-delay: 2.55s">a</tspan><tspan class="k" style="animation-delay: 2.61s">s</tspan><tspan class="k" style="animation-delay: 2.67s">t</tspan><tspan class="k" style="animation-delay: 2.73s">e</tspan><tspan class="cursor">&#9611;</tspan></text>
  </g>
</svg>
